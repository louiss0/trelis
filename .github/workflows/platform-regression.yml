name: Platform regression

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  dart:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: dart --version
      - run: dart pub get
      # Formatting is a required gate ordered before analysis and tests so a
      # locally green test run cannot hide a red pipeline.
      - run: dart format --output=none --set-exit-if-changed .
      - run: dart analyze
      - run: dart run tool/check_issue_tracker.dart
      - run: dart run tool/check_doc_links.dart
      # Generated files are byte-compared against their generators. Running
      # this on the Windows and POSIX matrix entries proves UTF-8/LF
      # determinism across hosts rather than on one accidental checkout.
      - run: python tool/check_generated_diffs.py
      # The external public API checker analyzes the positive fixture as an
      # external package and requires every negative case to fail with its
      # expected diagnostic code.
      - run: dart run tool/check_public_api.dart
      - run: dart test --reporter expanded

  posix-native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.2
      - run: dart pub get
      - run: python3 test/posix_terminal_pty.py

  windows-native:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.2
      - run: dart pub get
      - name: Public TextInput native lifecycle
        shell: pwsh
        run: |
          foreach ($scenario in @('rich', 'linear-cursor', 'linear-long', 'help-text-linear', 'help-text-rich', 'help-password-linear', 'help-password-rich', 'help-password-interrupt-linear', 'help-text-eof-rich', 'redirected', 'dumb-auto', 'escape', 'interrupt', 'eof', 'error', 'repeat', 'session-retire', 'resize')) {
            $report = Join-Path $env:RUNNER_TEMP "text-input-$scenario.txt"
            & powershell -NoProfile -ExecutionPolicy Bypass -File test/text_input_windows.ps1 -Scenario $scenario -Report $report
            if (Test-Path $report) { Get-Content $report }
            if ($LASTEXITCODE -ne 0) { throw "Native scenario $scenario failed with exit code $LASTEXITCODE" }
          }
      - name: Multiline paste through the Windows pseudoconsole
        shell: pwsh
        run: |
          & powershell -NoProfile -ExecutionPolicy Bypass -File test/multiline_conpty_windows.ps1
          if ($LASTEXITCODE -ne 0) { throw "Multiline pseudoconsole regression failed with exit code $LASTEXITCODE" }
