name: Platform regression

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  dart:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.2
      - run: dart --version
      - run: dart pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: dart analyze
      - run: dart run tool/check_doc_links.dart
      - run: dart test --reporter expanded

  posix-native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.2
      - run: dart pub get
      - run: python3 test/posix_terminal_pty.py

  windows-native:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.2
      - run: dart pub get
      - name: Public TextInput native lifecycle
        shell: pwsh
        run: |
          foreach ($scenario in @('rich', 'linear-cursor', 'linear-long', 'help-text-linear', 'help-text-rich', 'help-password-linear', 'help-password-rich', 'help-password-interrupt-linear', 'help-text-eof-rich', 'redirected', 'dumb-auto', 'escape', 'interrupt', 'eof', 'error', 'repeat', 'session-retire')) {
            $report = Join-Path $env:RUNNER_TEMP "text-input-$scenario.txt"
            & powershell -NoProfile -ExecutionPolicy Bypass -File test/text_input_windows.ps1 -Scenario $scenario -Report $report
            if (Test-Path $report) { Get-Content $report }
            if ($LASTEXITCODE -ne 0) { throw "Native scenario $scenario failed with exit code $LASTEXITCODE" }
          }
      - name: Multiline paste through the Windows pseudoconsole
        shell: pwsh
        run: |
          & powershell -NoProfile -ExecutionPolicy Bypass -File test/multiline_conpty_windows.ps1
          if ($LASTEXITCODE -ne 0) { throw "Multiline pseudoconsole regression failed with exit code $LASTEXITCODE" }
